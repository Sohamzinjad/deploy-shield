networks:
  deployshield-net:
    name: deployshield-net
    driver: bridge

services:
  init-db:
    image: postgres:15-alpine
    env_file: .env
    command: ["sh", "-c", "psql $DATABASE_URL -f /db/init.sql"]
    volumes:
      - ./db/init.sql:/db/init.sql:ro
    networks:
      - deployshield-net

  ml-service:
    build:
      context: ./ml-service
    ports:
      - "8002:8000"
    environment:
      - PORT=8000
    volumes:
      - ./ml-service/models:/app/models
    networks:
      - deployshield-net

  gateway:
    build:
      context: ./gateway
    ports:
      - "8080:8000"
    environment:
      - PORT=8000
      - ML_SERVICE_URL=http://ml-service:8000
      - API_SERVER_URL=http://api-server:5000
    depends_on:
      - ml-service
      - api-server
    networks:
      - deployshield-net

  api-server:
    build:
      context: ./api-server
    ports:
      - "5003:5000"
    env_file: .env
    environment:
      - PORT=5000
      - BUILD_SERVICE_URL=http://build-service:5001
    depends_on:
      - init-db
    networks:
      - deployshield-net

  build-service:
    build:
      context: ./build-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - API_SERVER_URL=http://api-server:5000
      - DOCKER_NETWORK=deployshield-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sample-app:/app/sample-app:ro
    networks:
      - deployshield-net

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_SERVER_URL=http://localhost:5003
      - VITE_GATEWAY_URL=http://localhost:8080
    depends_on:
      - api-server
    networks:
      - deployshield-net
